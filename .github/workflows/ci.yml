name: CI

on:
  push:
    branches: [main, feat/*, chore/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # A pull request or branch is checked on the files it changes, so formatting debt already on main cannot fail an unrelated
      # change; a push to main is checked on the files in that push. `npm run format:check` still checks the whole repository.
      - name: Format check (changed files)
        env:
          FORMAT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.ref == 'refs/heads/main' && github.event.before || 'origin/main') }}
        run: npm run format:check:changed

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Integration tests (PGlite)
        run: npm run test:int

      - name: Build
        run: npm run build
